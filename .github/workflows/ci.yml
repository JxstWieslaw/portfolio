name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The npm/Turborepo workspace root is this repository's root, so no `working-directory`
# default and no path prefixes are needed. This workflow previously lived in the GitHub
# profile repo, where the workspace sat one level down in `portfolio/`; every step then
# carried a prefix, and `actions/setup-node`'s `cache-dependency-path` had to repeat it
# because non-`run` steps do not inherit the default. Extracting the app into its own
# repository removed that whole class of mistake.

jobs:
  verify:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # Node 22 ships npm 10; packageManager pins npm@11.19.0, and only the same npm reads the lockfile identically.
      - run: npm install -g npm@11.19.0
      - run: npm ci
      # Verifies registry signatures and provenance attestations of every installed package.
      - run: npm audit signatures
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      # Validates the committed 3D models, manifest and credits. No network: sources are
      # generated or already committed, and assets:fetch never runs in CI.
      # A directory or file named exactly assets-src at any depth, in any case. Exact on purpose: a bare
      # '*assets-src*' also refused unrelated names (docs/assets-src-notes.md). apps/web/tests/unit/assets-cli.test.ts
      # runs these very pathspecs against a throwaway repository.
      - name: No raw 3D sources are tracked (assets-src/ is gitignored; the repo is public)
        run: test -z "$(git ls-files -- ':(glob,icase)**/assets-src/**' ':(glob,icase)**/assets-src')"
      # Optimised output lives in apps/web/public/models and the unit-test fixture in apps/web/tests/fixtures;
      # a .glb anywhere else is a raw source or a stray export. apps/web/tests/unit/assets-cli.test.ts runs this pathspec.
      - name: Tracked .glb files live only where they belong
        run: test -z "$(git ls-files -- ':(glob,icase)**/*.glb' ':(exclude,glob,icase)apps/web/public/models/*.glb' ':(exclude,glob,icase)apps/web/tests/fixtures/*.glb')"
      - name: Validate 3D assets
        run: |
          npm run assets:check
          npm run assets:ingest -- --only generated --verify
      - name: Report placeholder content (never fails the build)
        run: npm run lint:content
      # Reports production advisories and never gates: main carries moderate/high advisories through
      # next's toolchain and NestJS that are not this repo's to fix today. Revisit when they clear.
      - name: Report production dependency advisories (never fails the build)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  budgets:
    name: Build and budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # Node 22 ships npm 10; packageManager pins npm@11.19.0, and only the same npm reads the lockfile identically.
      - run: npm install -g npm@11.19.0
      - run: npm ci
      - run: npm run build
      # No asset tooling (gltf-transform, sharp) in any client chunk: the ESLint rule cannot see a computed require.
      - name: Asset toolchain is absent from the client bundle
        run: npm run check:bundle
      # The model test seam exists only in the e2e job's build (NEXT_PUBLIC_MODEL_TEST=1). A production
      # build must not contain it: this fails if the seam, or its debug hook, shipped.
      - name: The model test seam is compiled out of the production build
        run: bash apps/web/scripts/check-no-model-seam.sh apps/web/.next/static
      - name: Enforce JS bundle budget
        run: npm run size -w @repo/web
      - name: Enforce Lighthouse budgets
        run: npm run lighthouse -w @repo/web

  e2e:
    name: E2E, accessibility and visual
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # Node 22 ships npm 10; packageManager pins npm@11.19.0, and only the same npm reads the lockfile identically.
      - run: npm install -g npm@11.19.0
      - run: npm ci
      - run: npm exec -w @repo/web -- playwright install --with-deps chromium webkit
      # Only this job's app is built with the model test seam; the models spec needs it to place a model.
      - run: npm run test:e2e -w @repo/web
        env:
          NEXT_PUBLIC_MODEL_TEST: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  api-integration:
    name: API — migrations, seed and integration tests on Postgres 17
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # Node 22 ships npm 10; packageManager pins npm@11.19.0, and only the same npm reads the lockfile identically.
      - run: npm install -g npm@11.19.0
      - run: npm ci
      - name: Every migration ships a down.sql
        run: npm run db:migrate -w @repo/api -- --verify
      - name: Generated SQL is up to date with the Drizzle schema
        run: |
          set -euo pipefail
          npm exec -w @repo/api -- drizzle-kit generate --name ci_drift_check
          if [ -n "$(git status --porcelain apps/api/drizzle)" ]; then
            echo "drizzle/ is stale — run: npm run db:generate -w @repo/api -- --name <change>"
            git status --porcelain apps/api/drizzle
            exit 1
          fi
      - name: Integration and end-to-end suites
        run: npm run test:integration -w @repo/api
      - name: Migrations apply and content seeds cleanly from git
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: |
          npm run db:migrate -w @repo/api -- --dry-run
          npm run db:migrate -w @repo/api -- --apply
          npm run db:seed -w @repo/api -- --apply
          npm run db:seed -w @repo/api -- --check

  api-image:
    name: API — image size, boot and vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build
        run: docker build -f apps/api/Dockerfile -t portfolio-api:ci .
      - name: Image is within the 200 MB budget (compressed)
        run: |
          set -euo pipefail
          size=$(docker save portfolio-api:ci | gzip -c | wc -c)
          echo "Compressed image size: $((size / 1000000)) MB (budget 200 MB)"
          test "$size" -le 200000000
      - name: Boots and answers liveness without a database
        run: |
          docker run -d --name api -p 8080:8080 \
            -e DATABASE_URL=postgres://nobody:nothing@127.0.0.1:1/none portfolio-api:ci
          for attempt in $(seq 1 40); do
            if curl -fsS http://localhost:8080/v1/health; then exit 0; fi
            sleep 0.25
          done
          docker logs api
          exit 1
      - name: No fixable HIGH or CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: portfolio-api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
          trivyignores: .trivyignore.yaml
          exit-code: '1'

  api-neon-branch:
    name: API — migrations against a Neon branch of production
    # Runs once the Neon project exists, and never for forks or Dependabot (neither gets the secrets:
    # Dependabot PRs opened on 2026-10-01 all failed here before any of their own checks ran).
    if: >-
      github.event_name == 'pull_request' &&
      vars.NEON_PROJECT_ID != '' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # Node 22 ships npm 10; packageManager pins npm@11.19.0, and only the same npm reads the lockfile identically.
      - run: npm install -g npm@11.19.0
      - run: npm ci
      - name: Branch production data for this PR
        id: branch
        uses: neondatabase/create-branch-action@72ed4f69a12b6be9c16aebfad893f6a21e9aba8b # v6.4.0
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: preview/pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_API_KEY }}
          # The action defaults to Neon's `neondb` / `neondb_owner`; this project's names differ.
          database: portfolio
          role: portfolio_owner
      - name: Dry-run, apply, seed and check against the real data shape
        env:
          DATABASE_URL: ${{ steps.branch.outputs.db_url }}
        run: |
          npm run db:migrate -w @repo/api -- --dry-run
          npm run db:migrate -w @repo/api -- --apply
          npm run db:seed -w @repo/api -- --apply
          npm run db:seed -w @repo/api -- --check
