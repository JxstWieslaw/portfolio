name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The pnpm/Turborepo workspace root is this repository's root, so no `working-directory`
# default and no path prefixes are needed. This workflow previously lived in the GitHub
# profile repo, where the workspace sat one level down in `portfolio/`; every step then
# carried a prefix, and `actions/setup-node`'s `cache-dependency-path` had to repeat it
# because non-`run` steps do not inherit the default. Extracting the app into its own
# repository removed that whole class of mistake.

jobs:
  verify:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose — `packageManager` in package.json is the single
      # source of truth, and specifying both makes this action fail with
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Report placeholder content (never fails the build)
        run: pnpm lint:content

  budgets:
    name: Build and budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose — `packageManager` in package.json is the single
      # source of truth, and specifying both makes this action fail with
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Enforce JS bundle budget
        run: pnpm --filter @repo/web size
      - name: Enforce Lighthouse budgets
        run: pnpm --filter @repo/web lighthouse

  e2e:
    name: E2E, accessibility and visual
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose — `packageManager` in package.json is the single
      # source of truth, and specifying both makes this action fail with
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @repo/web exec playwright install --with-deps chromium webkit
      - run: pnpm --filter @repo/web test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  api-integration:
    name: API — migrations, seed and integration tests on Postgres 17
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      # No `version:` — `packageManager` in package.json is the single source of truth.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Every migration ships a down.sql
        run: pnpm --filter @repo/api db:migrate --verify
      - name: Integration and end-to-end suites
        run: pnpm --filter @repo/api test:integration
      - name: Migrations apply and content seeds cleanly from git
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: |
          pnpm --filter @repo/api db:migrate --dry-run
          pnpm --filter @repo/api db:migrate --apply
          pnpm --filter @repo/api db:seed --apply
          pnpm --filter @repo/api db:seed --check

  api-image:
    name: API — image size, boot and vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f apps/api/Dockerfile -t portfolio-api:ci .
      - name: Image is within the 200 MB budget (compressed)
        run: |
          size=$(docker save portfolio-api:ci | gzip -c | wc -c)
          echo "Compressed image size: $((size / 1000000)) MB (budget 200 MB)"
          test "$size" -le 200000000
      - name: Boots and answers liveness without a database
        run: |
          docker run -d --name api -p 8080:8080 \
            -e DATABASE_URL=postgres://nobody:nothing@127.0.0.1:1/none portfolio-api:ci
          for attempt in $(seq 1 40); do
            if curl -fsS http://localhost:8080/v1/health; then exit 0; fi
            sleep 0.25
          done
          docker logs api
          exit 1
      - name: No fixable HIGH or CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: portfolio-api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: '1'

  api-neon-branch:
    name: API — migrations against a Neon branch of production
    # Runs once the Neon project exists, and never for forks (no secrets there).
    if: >-
      github.event_name == 'pull_request' &&
      vars.NEON_PROJECT_ID != '' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Branch production data for this PR
        id: branch
        uses: neondatabase/create-branch-action@v6.4.0
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: preview/pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_API_KEY }}
      - name: Dry-run, apply, seed and check against the real data shape
        env:
          DATABASE_URL: ${{ steps.branch.outputs.db_url }}
        run: |
          pnpm --filter @repo/api db:migrate --dry-run
          pnpm --filter @repo/api db:migrate --apply
          pnpm --filter @repo/api db:seed --apply
          pnpm --filter @repo/api db:seed --check
