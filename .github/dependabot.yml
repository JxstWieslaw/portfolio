version: 2
updates:
  # Base images are pinned by digest, which goes stale silently; this opens a reviewable PR that moves
  # the pin when the distroless or node image is republished (it is how the OpenSSL findings waived in
  # .trivyignore.yaml get fixed). Monthly keeps the noise low.
  # GitHub Actions are pinned by SHA but deliberately not tracked here; bump them by hand when needed.
  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: monthly
    ignore:
      # The runtime is Node 22 (distroless nodejs22); a new Node major is a deliberate change, not a bump.
      - dependency-name: node
        update-types: ['version-update:semver-major']
  # npm dependencies: one monthly PR grouping minor and patch bumps, so routine updates arrive through
  # the same reviewed path as the base-image pins. Majors still open their own PR.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
