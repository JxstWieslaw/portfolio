version: 2
updates:
  # Base images are pinned by digest, which goes stale silently; this opens a reviewable PR that moves
  # the pin when the distroless or node image is republished (it is how the OpenSSL findings waived in
  # .trivyignore.yaml get fixed). Monthly keeps the noise low.
  # GitHub Actions are pinned by SHA but deliberately not tracked here; bump them by hand when needed.
  - package-ecosystem: docker
    directory: /apps/api
    target-branch: develop
    schedule:
      interval: monthly
    ignore:
      # The runtime is Node 22 (distroless nodejs22); a new Node major is a deliberate change, not a bump.
      - dependency-name: node
        update-types: ['version-update:semver-major']
  # npm dependencies: one monthly PR grouping minor and patch bumps, so routine updates arrive through
  # the same reviewed path as the base-image pins. Majors are deliberate upgrades, not bumps: they are
  # ignored here and done by hand with their migration notes (the first run opened TypeScript 7,
  # NestJS 12 and jest-dom 7 unprompted). jsdom is held at 30.0.1 by a root override because 30.1
  # breaks the scrim probe test; a bump PR would only fight the override.
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      - dependency-name: jsdom
